<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <clipPath id="hueco"><circle cx="64" cy="60" r="34"/></clipPath>
    <radialGradient id="fondo" cx="64" cy="66" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6f5f4"/>
      <stop offset="1" stop-color="#deddda"/>
    </radialGradient>
  </defs>

  <!-- Placa: perfil frontal (grosor) + cara superior -->
  <rect x="16" y="20" width="96" height="92" rx="20" fill="#c0bfbc"/>
  <rect x="16" y="22" width="96" height="88" rx="20" fill="#deddda"/>
  <rect x="16" y="14" width="96" height="92" rx="20" fill="#ffffff"/>

  <!-- Hueco circular de la toma: pared superior en sombra -->
  <circle cx="64" cy="60" r="34" fill="#9a9996"/>
  <g clip-path="url(#hueco)">
    <circle cx="64" cy="64" r="33" fill="url(#fondo)"/>
  </g>

  <!-- Contactos de tierra (pestañas metálicas arriba y abajo) -->
  <rect x="60" y="26" width="8" height="7" rx="1.5" fill="#77767b"/>
  <rect x="60" y="26" width="8" height="3.5" rx="1.5" fill="#c0bfbc"/>
  <rect x="60" y="89" width="8" height="7" rx="1.5" fill="#77767b"/>
  <rect x="60" y="92.5" width="8" height="3.5" rx="1.5" fill="#c0bfbc"/>

  <!-- Orificios de fase y neutro (separación real 19 mm sobre hueco de ~39 mm) -->
  <circle cx="47.5" cy="63" r="5.5" fill="#ffffff"/>
  <circle cx="80.5" cy="63" r="5.5" fill="#ffffff"/>
  <circle cx="47.5" cy="62" r="5.5" fill="#241f31"/>
  <circle cx="80.5" cy="62" r="5.5" fill="#241f31"/>
</svg>
